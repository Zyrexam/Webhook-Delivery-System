<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="box-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="box-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="box-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="box-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="box-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" letter-spacing="1">Webhook Delivery System Architecture</text>
  <text x="550" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Event Ingestion → Queuing → Delivery → Recovery</text>

  <!-- ==================== LAYER 1: EVENT INGESTION ==================== -->

  <!-- Sender Box -->
  <rect x="60" y="90" width="180" height="64" rx="8" fill="#475569" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="95" cy="122" r="14" fill="#64748b"/>
  <text x="95" y="127" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">📤</text>
  <text x="118" y="118" fill="#f1f5f9" font-size="13" font-weight="600">Sender</text>
  <text x="118" y="136" fill="#94a3b8" font-size="10">External System</text>

  <!-- Arrow from Sender to FastAPI -->
  <line x1="240" y1="122" x2="310" y2="122" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray=""/>
  <text x="275" y="112" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="500">POST /events</text>

  <!-- FastAPI Box -->
  <rect x="320" y="80" width="200" height="84" rx="8" fill="url(#box-blue)" filter="url(#shadow)"/>
  <text x="420" y="107" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">FastAPI Server</text>
  <text x="420" y="124" text-anchor="middle" fill="#bfdbfe" font-size="10">main.py + routers</text>
  <text x="420" y="144" text-anchor="middle" fill="#dbeafe" font-size="9">1️⃣ Save event → Postgres</text>
  <text x="420" y="158" text-anchor="middle" fill="#dbeafe" font-size="9">2️⃣ Create delivery rows</text>

  <!-- Arrow FastAPI → Postgres -->
  <line x1="420" y1="164" x2="420" y2="220" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="440" y="195" fill="#4ade80" font-size="9" font-weight="500">INSERT</text>

  <!-- Postgres Box -->
  <rect x="295" y="228" width="250" height="88" rx="8" fill="url(#box-green)" filter="url(#shadow)"/>
  <text x="420" y="255" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">PostgreSQL</text>
  <text x="420" y="272" text-anchor="middle" fill="#bbf7d0" font-size="10">Source of Truth</text>
  <text x="420" y="290" text-anchor="middle" fill="#dcfce7" font-size="9">events 📄 | subscriptions 📋</text>
  <text x="420" y="304" text-anchor="middle" fill="#dcfce7" font-size="9">webhook_deliveries 📦</text>

  <!-- Arrow FastAPI → Redis -->
  <line x1="520" y1="122" x2="670" y2="122" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="595" y="112" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="500">lpush delivery IDs</text>

  <!-- Response arrow back -->
  <line x1="420" y1="80" x2="240" y2="80" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="5,3"/>
  <text x="330" y="73" text-anchor="middle" fill="#4ade80" font-size="9">202 Accepted</text>

  <!-- ==================== REDIS BOX ==================== -->

  <rect x="680" y="90" width="360" height="200" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="860" y="115" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Redis 7</text>

  <!-- Redis Queue List -->
  <rect x="700" y="130" width="150" height="70" rx="6" fill="url(#box-orange)" opacity="0.9"/>
  <text x="775" y="152" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">📋 webhook_queue</text>
  <text x="775" y="168" text-anchor="middle" fill="#fef3c7" font-size="9">LIST (BRPOP)</text>
  <text x="775" y="184" text-anchor="middle" fill="#fef3c7" font-size="9">Active jobs</text>

  <!-- Redis Sorted Set -->
  <rect x="870" y="130" width="150" height="70" rx="6" fill="url(#box-orange)" opacity="0.9"/>
  <text x="945" y="152" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">⏰ webhook_retry</text>
  <text x="945" y="168" text-anchor="middle" fill="#fef3c7" font-size="9">Sorted Set</text>
  <text x="945" y="184" text-anchor="middle" fill="#fef3c7" font-size="9">Delayed retries</text>

  <!-- Arrow between Redis structures -->
  <path d="M 850 165 L 865 165" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ==================== LAYER 2: DELIVERY ==================== -->

  <!-- Worker Box -->
  <rect x="60" y="360" width="220" height="90" rx="8" fill="url(#box-purple)" filter="url(#shadow)"/>
  <text x="170" y="388" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">🛠️ Delivery Worker</text>
  <text x="170" y="406" text-anchor="middle" fill="#ddd6fe" font-size="10">worker.py</text>
  <text x="170" y="425" text-anchor="middle" fill="#ede9fe" font-size="9">BRPOP → Check circuit breaker</text>
  <text x="170" y="440" text-anchor="middle" fill="#ede9fe" font-size="9">→ Sign HMAC → HTTP POST</text>

  <!-- Arrow Worker → Redis Queue (pull) -->
  <path d="M 280 405 L 695 405" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="490" y="395" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="500">BRPOP pulls jobs</text>

  <!-- Arrow Worker → Subscriber -->
  <line x1="170" y1="450" x2="170" y2="520" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192" y="490" fill="#a78bfa" font-size="9" font-weight="500">HTTP POST + HMAC</text>

  <!-- Subscriber Box -->
  <rect x="60" y="528" width="220" height="80" rx="8" fill="url(#box-green)" filter="url(#shadow)"/>
  <text x="170" y="555" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">🎯 Subscriber</text>
  <text x="170" y="573" text-anchor="middle" fill="#bbf7d0" font-size="10">webhook_receiver.py</text>
  <text x="170" y="591" text-anchor="middle" fill="#dcfce7" font-size="9">Verify signature → Process → 200 OK</text>

  <!-- Arrow Worker → Postgres (read/update) -->
  <path d="M 280 380 L 400 380 L 400 316" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" fill="none" stroke-dasharray="5,3"/>
  <text x="340" y="373" fill="#4ade80" font-size="9">Read/Update status</text>

  <!-- ==================== RETRY SCHEDULER ==================== -->

  <!-- Scheduler Box -->
  <rect x="520" y="360" width="240" height="80" rx="8" fill="url(#box-orange)" filter="url(#shadow)"/>
  <text x="640" y="388" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">⏳ Retry Scheduler</text>
  <text x="640" y="406" text-anchor="middle" fill="#fef3c7" font-size="10">worker.py (co-routine)</text>
  <text x="640" y="424" text-anchor="middle" fill="#fef3c7" font-size="9">Every 5s: ZRANGEBYSCORE → LPUSH</text>

  <!-- Arrow Scheduler → Redis Retry -->
  <path d="M 760 380 L 865 380 L 865 205" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none"/>
  <text x="810" y="365" fill="#fbbf24" font-size="9">Move ready jobs</text>

  <!-- Arrow Scheduler → Redis Queue -->
  <path d="M 640 360 L 640 330 L 775 330 L 775 205" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none"/>
  <text x="710" y="323" fill="#fbbf24" font-size="9">Re-queue</text>

  <!-- ==================== REAPER ==================== -->

  <!-- Reaper Box -->
  <rect x="520" y="480" width="240" height="80" rx="8" fill="url(#box-red)" filter="url(#shadow)"/>
  <text x="640" y="508" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">💀 Crash Reaper</text>
  <text x="640" y="526" text-anchor="middle" fill="#fecaca" font-size="10">reaper.py</text>
  <text x="640" y="544" text-anchor="middle" fill="#fee2e2" font-size="9">Every 30s: Rescue stuck IN_FLIGHT</text>

  <!-- Arrow Reaper → Postgres -->
  <path d="M 520 520 L 430 520 L 430 316" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" fill="none" stroke-dasharray="5,3"/>
  <text x="470" y="513" fill="#4ade80" font-size="9">Find + reset stuck jobs</text>

  <!-- Arrow Reaper → Redis Queue -->
  <path d="M 640 560 L 640 590 L 775 590 L 775 470 L 775 205" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)" fill="none" stroke-dasharray="5,3"/>
  <text x="740" y="583" fill="#fbbf24" font-size="9">Re-queue rescued</text>

  <!-- ==================== LEGEND ==================== -->

  <rect x="60" y="640" width="980" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="80" y="662" fill="#94a3b8" font-size="11" font-weight="600">Legend:</text>
  
  <rect x="150" y="650" width="12" height="12" rx="3" fill="#3b82f6"/>
  <text x="168" y="662" fill="#cbd5e1" font-size="10">Ingestion</text>
  
  <rect x="250" y="650" width="12" height="12" rx="3" fill="#8b5cf6"/>
  <text x="268" y="662" fill="#cbd5e1" font-size="10">Worker</text>
  
  <rect x="340" y="650" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="358" y="662" fill="#cbd5e1" font-size="10">Storage</text>
  
  <rect x="440" y="650" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="458" y="662" fill="#cbd5e1" font-size="10">Queue</text>
  
  <rect x="530" y="650" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="548" y="662" fill="#cbd5e1" font-size="10">Recovery</text>
  
  <line x1="640" y1="656" x2="690" y2="656" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="698" y="662" fill="#cbd5e1" font-size="10">Flow</text>
  
  <line x1="790" y1="656" x2="840" y2="656" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="848" y="662" fill="#cbd5e1" font-size="10">Read/Response</text>

  <!-- Data flow numbers -->
  <text x="60" y="690" fill="#64748b" font-size="9">① POST /events → ② Save to Postgres → ③ Create deliveries → ④ Push to Redis → ⑤ Return 202 → ⑥ Worker picks up → ⑦ HTTP POST subscriber</text>
</svg>